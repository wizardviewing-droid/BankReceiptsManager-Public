name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore BankReceiptsManager.sln

    - name: Run tests
      run: dotnet test BankReceiptsManager.sln -c Release --no-restore

    - name: Publish self-contained single-file
      run: |
        dotnet publish src/BankReceiptsManager/BankReceiptsManager.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BankReceiptsManager.iss

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: BankReceiptsManager-Setup
        path: installer/Output/BankReceiptsManager-Setup.exe
        retention-days: 30

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.7
        name: Bank Receipts Manager v1.3.7
        body: Windows installer for Bank Receipts Manager v1.3.7 (1.3.7-milestone1). Fixes the startup crash (command parameter MS.Internal.NamedObject) and adds startup logging. Double-click BankReceiptsManager-Setup.exe to install. Email sending is disabled in this testing version.
        files: installer/Output/BankReceiptsManager-Setup.exe
        draft: false
        prerelease: false
        make_latest: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
